services:
  nginx:
    image: nginx:1.25.4-alpine
    container_name: lemp_nginx
    restart: unless-stopped
    ports:
      - "4001:80"
    volumes:
      - ./html_src:/var/www/html
      - ./nginx_conf/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - backend
    depends_on:
      - php

  php:
    image: php:8.3.4-fpm-alpine
    container_name: lemp_php
    restart: unless-stopped
    volumes:
      - ./html_src:/var/www/html
    command: sh -c "docker-php-ext-install mysqli && php-fpm"
    networks:
      - backend
    depends_on:
      - mysql

  mysql:
    image: mysql:8.3.0
    container_name: lemp_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: lemp_db
      MYSQL_USER: lemp_user
      MYSQL_PASSWORD: lemp_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: lemp_phpmyadmin
    restart: unless-stopped
    ports:
      - "6001:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root_secure_password
    networks:
      - frontend
      - backend
    depends_on:
      - mysql

volumes:
  mysql_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge